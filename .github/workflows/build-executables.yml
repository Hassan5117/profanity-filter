name: Build Executables

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform(s) to build
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - macos
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download static FFmpeg and FFprobe
        run: python packaging/build.py --download-ffmpeg --only-download-ffmpeg --ffmpeg-dir packaging/vendor/win64

      - name: Add static FFmpeg to PATH for tests
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path "packaging/vendor/win64").Path

      - name: Run unit and integration tests
        run: python -m unittest discover -s censor_app/tests -v

      - name: Build, smoke-test, and zip executable
        run: python packaging/build.py --ffmpeg-dir packaging/vendor/win64 --zip

      - name: Upload Windows build archive
        uses: actions/upload-artifact@v4
        with:
          name: MovieCensorStudio-windows
          path: dist/*.zip

  build-macos:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Download static FFmpeg and FFprobe
        run: python packaging/build.py --download-ffmpeg --only-download-ffmpeg --ffmpeg-dir packaging/vendor/darwin

      - name: Add static FFmpeg to PATH for tests
        shell: bash
        run: echo "$(pwd)/packaging/vendor/darwin" >> "$GITHUB_PATH"

      - name: Run unit and integration tests
        run: python -m unittest discover -s censor_app/tests -v

      - name: Build, smoke-test, and zip executable
        run: python packaging/build.py --ffmpeg-dir packaging/vendor/darwin --zip

      - name: Upload macOS build archive
        uses: actions/upload-artifact@v4
        with:
          name: MovieCensorStudio-macos
          path: dist/*.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
